name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test before release
        run: dotnet test MDAsisst.sln -c Release

      - name: Publish (self-contained, single-file)
        # ISS-017: MDAsisst.App.csproj 側で Release + RuntimeIdentifier 指定時に
        # PublishSingleFile を有効化済み。MDAsisst.dll は MDAsisst.exe に統合され、
        # current フォルダの管理対象ファイルが削減される（ACL/ロック起因の削除失敗対策）。
        run: >
          dotnet publish src/MDAsisst.App/MDAsisst.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Download existing releases (for delta)
        run: vpk download github --repoUrl https://github.com/${{ github.repository }}
        continue-on-error: true

      - name: Pack
        # ADR-0009: Program Files への per-machine インストールに変更。
        # --msi でMSIインストーラーを追加生成し、--instLocation PerMachine で
        # インストール先を Program Files\Ferrotec Corporation\MDAsisst（要管理者権限）に固定する。
        # 配布・案内は Setup.exe ではなく .msi を用いること（Setup.exe は per-user 固定のため）。
        # ADR-0012 (ISS-009): vpk 1.2.0 は --noInst と --noPortable を同時指定できない
        # （"Cannot use '--noPortable' and '--noInst' options together" でPackが失敗する。
        # v0.3.3実機検証で確認済み）。そのためPack自体は変更せず、次のクリーンアップ手順で
        # per-user用資産のみをアップロード対象から除外する。
        run: >
          vpk pack
          -u Ferrotec.MDAsisst
          -v ${{ steps.ver.outputs.version }}
          -p publish
          -e MDAsisst.exe
          --packTitle "MDAsisst"
          --packAuthors "Ferrotec Corporation"
          --channel win
          --msi
          --instLocation PerMachine

      - name: Remove per-user distributables (ISS-009, ADR-0012)
        # v0.3.3の初回試行で判明: `vpk upload github` は実フォルダを走査するのではなく
        # Releases/assets.win.json（vpk pack が書き出すアップロード対象マニフェスト、
        # Velopack.Core.BuildAssets）に記載された相対パスをそのままアップロードしようと
        # するため、ファイルだけ削除すると "Could not find file" で失敗する。
        # そのため assets.win.json から Type=Portable / Installer のエントリも取り除いてから
        # 実ファイルを削除する。RELEASES / releases.win.json（更新確認フィード）は
        # Upload時にvpk自身がFull/Deltaのみで再生成するため、ここでは触らない。
        shell: pwsh
        run: |
          $assetsPath = "Releases/assets.win.json"
          if (Test-Path $assetsPath) {
            $assets = @(Get-Content $assetsPath -Raw | ConvertFrom-Json)
            $filtered = @($assets | Where-Object { $_.Type -ne "Portable" -and $_.Type -ne "Installer" })
            $filtered | ConvertTo-Json -AsArray -Depth 5 | Set-Content $assetsPath -Encoding utf8NoBOM
            Write-Host "assets.win.json (filtered):"
            Get-Content $assetsPath
          } else {
            Write-Error "assets.win.json が見つかりません。vpk pack の出力先/チャンネル指定を確認してください。"
            exit 1
          }
          Remove-Item -Path "Releases/*-Setup.exe" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "Releases/*-Portable.zip" -Force -ErrorAction SilentlyContinue
          Get-ChildItem "Releases" | Format-Table Name, Length

      - name: Upload to GitHub Releases
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --publish
          --releaseName "MDAsisst ${{ steps.ver.outputs.version }}"
          --tag ${{ github.ref_name }}
          --token ${{ secrets.GITHUB_TOKEN }}
